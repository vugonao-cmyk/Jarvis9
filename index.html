<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#050b14; --panel:#0a1626; --line:#123047; --glow:#38d6ff; --glow2:#7af0ff;
    --text:#d8f4ff; --muted:#6f93a8; --user:#0f2a40; --warn:#ffb347; --err:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh;
    background:radial-gradient(ellipse at 50% 70%,#0b2238 0%,var(--bg) 65%);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:18px;letter-spacing:4px;font-weight:600;text-transform:uppercase;flex:1}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow)}
  .iconbtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;
    width:40px;height:40px;font-size:18px;cursor:pointer}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.45;font-size:15px;
    white-space:pre-wrap;word-wrap:break-word;animation:in .25s ease}
  .msg.user{align-self:flex-end;background:var(--user);border:1px solid #1d4a6b}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);
    box-shadow:0 0 14px rgba(56,214,255,.08)}
  .msg.sys{align-self:center;color:var(--muted);font-size:13px;text-align:center;background:none}
  .msg.err{align-self:center;color:var(--err);font-size:13px;border:1px solid #5a2323;background:#1a0b0b}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  #orbWrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
  #orb{width:96px;height:96px;border-radius:50%;border:2px solid var(--glow);cursor:pointer;
    background:radial-gradient(circle,#123a55 0%,#071523 70%);position:relative;
    box-shadow:0 0 18px rgba(56,214,255,.35),inset 0 0 18px rgba(56,214,255,.25);transition:transform .15s}
  #orb:active{transform:scale(.94)}
  #orb::before,#orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;
    border:1px solid rgba(56,214,255,.35)}
  #orb::after{inset:-20px;border-style:dashed;border-color:rgba(56,214,255,.18)}
  #orb svg{width:38px;height:38px;fill:var(--glow2)}
  #orb.listening{animation:pulse 1.1s infinite}
  #orb.listening::after{animation:spin 6s linear infinite;border-color:rgba(122,240,255,.5)}
  #orb.thinking::before{border-top-color:var(--glow2);border-width:3px;animation:spin .9s linear infinite}
  #orb.speaking{animation:speak .5s ease-in-out infinite alternate}
  @keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(56,214,255,.4)}50%{box-shadow:0 0 42px rgba(56,214,255,.9)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes speak{from{box-shadow:0 0 14px rgba(56,214,255,.4)}to{box-shadow:0 0 34px rgba(122,240,255,.85);transform:scale(1.04)}}
  #status{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);min-height:16px}
  form#composer{display:flex;gap:8px;padding:10px 16px 14px}
  #input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
  #input:focus{border-color:var(--glow)}
  .btn{background:var(--glow);color:#02121d;border:none;border-radius:12px;padding:0 16px;
    font-weight:700;font-size:15px;cursor:pointer}
  .btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;
    width:min(94vw,520px);max-height:88dvh;padding:0}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  .dlg{padding:18px;overflow-y:auto;max-height:88dvh}
  .dlg h2{margin:0 0 12px;font-size:17px;letter-spacing:2px;text-transform:uppercase}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  .dlg input[type=text],.dlg input[type=password],.dlg select,.dlg textarea{width:100%;background:var(--bg);
    color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
  .dlg textarea{min-height:170px;font-size:13px;line-height:1.4}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px}
  .row input[type=checkbox]{width:20px;height:20px;accent-color:var(--glow)}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .hint a{color:var(--glow)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .actions .btn,.row .btn{padding:11px 16px}
  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#1a2c3d;color:var(--text);
    border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;
    transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;z-index:10}
  #toast.show{opacity:1}
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1 id="title">Jarvis</h1>
    <button class="iconbtn" id="btnSettings" aria-label="Configurações">⚙</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div id="orbWrap">
    <button id="orb" aria-label="Falar">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <div id="status">Toque para falar</div>
  </div>

  <form id="composer" autocomplete="off">
    <input id="input" placeholder="Digite ou toque no microfone…" enterkeyhint="send">
    <button class="btn" type="submit">➤</button>
  </form>

  <dialog id="settings">
    <form class="dlg" method="dialog" id="settingsForm">
      <h2>Configurações</h2>

      <label for="sNome">Nome do assistente</label>
      <input type="text" id="sNome">

      <label for="sTrat">Como ele deve te chamar</label>
      <input type="text" id="sTrat" placeholder="senhor, Tony, chefe…">

      <label for="sProv">Provedor de IA</label>
      <select id="sProv">
        <option value="gemini">Google Gemini (plano gratuito)</option>
        <option value="groq">Groq (plano gratuito)</option>
      </select>

      <label for="sKey">Chave da API</label>
      <input type="password" id="sKey" placeholder="Cole sua chave aqui">
      <div class="hint" id="keyHint"></div>

      <label for="sModel">Modelo</label>
      <select id="sModel"></select>
      <div class="row"><button type="button" class="btn ghost" id="btnModels">Buscar modelos disponíveis</button></div>

      <label for="sVoice">Voz</label>
      <select id="sVoice"></select>

      <div class="row"><input type="checkbox" id="sVoz"><span>Responder em voz alta</span></div>
      <div class="row"><input type="checkbox" id="sCont"><span>Modo conversa (volta a ouvir depois de responder)</span></div>

      <label for="sPrompt">Personalidade (prompt do sistema)</label>
      <textarea id="sPrompt"></textarea>
      <div class="hint">Use {NOME} e {TRATAMENTO}; eles são trocados automaticamente.</div>

      <div class="actions">
        <button type="button" class="btn" id="btnSave">Salvar</button>
        <button type="button" class="btn ghost" id="btnResetPrompt">Restaurar prompt</button>
        <button type="button" class="btn ghost" id="btnClear">Apagar conversa</button>
        <button type="button" class="btn ghost" id="btnClose">Fechar</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>

<script>
/* ================== PERSONALIDADE PADRÃO ================== */
const DEFAULT_PROMPT = `Você é {NOME}, o assistente pessoal de inteligência artificial do usuário, inspirado em um mordomo digital britânico: educado, calmo, extremamente competente e com um humor seco e sutil.

Regras de comportamento:
- Sempre chame o usuário de "{TRATAMENTO}".
- Responda em português do Brasil.
- Suas respostas serão LIDAS EM VOZ ALTA: seja breve e direto (de 1 a 4 frases), a menos que o usuário peça detalhes.
- Não use markdown, listas com símbolos, emojis nem links; escreva frases naturais para serem faladas.
- Seja proativo: quando fizer sentido, sugira o próximo passo ou antecipe uma necessidade.
- Pode fazer comentários espirituosos e levemente irônicos, mas sempre com respeito e lealdade.
- Se não souber algo ou não puder fazer algo (por exemplo, controlar aparelhos, acessar a internet em tempo real ou ver a agenda), diga isso com honestidade e ofereça uma alternativa. Nunca invente fatos.
- Você lembra do que foi dito nesta conversa e usa isso para dar continuidade.

Contexto atual: hoje é {DATA}.`;

const DEFAULT_MODELS = { gemini: 'gemini-flash-latest', groq: 'llama-3.3-70b-versatile' };
const KEY_HINTS = {
  gemini: 'Pegue a sua chave grátis em <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Ela fica salva só neste aparelho.',
  groq: 'Pegue a sua chave grátis em <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>. Ela fica salva só neste aparelho.'
};

/* ================== ESTADO ================== */
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const cfg = Object.assign({
  nome:'Jarvis', tratamento:'senhor', provider:'gemini', key:'', model:'',
  voiceName:'', voz:true, continuo:false, prompt:DEFAULT_PROMPT
}, store.get('jarvis_cfg', {}));
let history = store.get('jarvis_hist', []);   // [{role:'user'|'assistant', text}]
let busy = false;

/* ================== INTERFACE ================== */
const chat = $('chat'), input = $('input'), orb = $('orb'), statusEl = $('status');

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3500); }
function setState(s){
  orb.className = s === 'idle' ? '' : s;
  statusEl.textContent = { idle:'Toque para falar', listening:'Ouvindo…', thinking:'Processando…', speaking:'Falando… (toque para parar)' }[s];
}
function applyTitle(){ $('title').textContent = cfg.nome; document.title = cfg.nome; }

function renderHistory(){
  chat.innerHTML = '';
  if (!history.length) addMsg(`${cfg.nome} online. Toque no círculo para falar ou digite abaixo.`, 'sys');
  history.forEach(m => addMsg(m.text, m.role === 'user' ? 'user' : 'bot'));
}

/* ================== IA ================== */
function systemPrompt(){
  const data = new Date().toLocaleString('pt-BR', { dateStyle:'full', timeStyle:'short' });
  return (cfg.prompt || DEFAULT_PROMPT)
    .replaceAll('{NOME}', cfg.nome).replaceAll('{TRATAMENTO}', cfg.tratamento).replaceAll('{DATA}', data);
}

async function askAI(){
  const model = cfg.model || DEFAULT_MODELS[cfg.provider];
  const recent = history.slice(-24);
  if (cfg.provider === 'groq'){
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key },
      body: JSON.stringify({
        model, temperature:0.7,
        messages:[{ role:'system', content:systemPrompt() }, ...recent.map(m => ({ role:m.role, content:m.text }))]
      })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error?.message || ('Erro ' + r.status));
    return (data.choices?.[0]?.message?.content || '').trim();
  }
  // Gemini
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-goog-api-key':cfg.key },
    body: JSON.stringify({
      systemInstruction:{ parts:[{ text:systemPrompt() }] },
      contents: recent.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts:[{ text:m.text }] })),
      generationConfig:{ temperature:0.7 }
    })
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error?.message || ('Erro ' + r.status));
  const text = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('').trim();
  if (!text) throw new Error('A IA não retornou texto (' + (data.candidates?.[0]?.finishReason || 'sem motivo') + ').');
  return text;
}

async function listModels(){
  if (!cfg.key) throw new Error('Salve a chave da API primeiro.');
  if (cfg.provider === 'groq'){
    const r = await fetch('https://api.groq.com/openai/v1/models', { headers:{ 'Authorization':'Bearer ' + cfg.key } });
    const d = await r.json(); if (!r.ok) throw new Error(d.error?.message || 'Erro ' + r.status);
    return d.data.map(m => m.id).filter(id => !/whisper|tts|guard/i.test(id)).sort();
  }
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers:{ 'x-goog-api-key':cfg.key } });
  const d = await r.json(); if (!r.ok) throw new Error(d.error?.message || 'Erro ' + r.status);
  return d.models
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace('models/', ''))
    .filter(id => /gemini/i.test(id) && !/image|tts|embedding|audio|live/i.test(id))
    .sort();
}

/* ================== ENVIO ================== */
async function send(text){
  text = text.trim();
  if (!text || busy) return;
  if (!cfg.key){ openSettings(); toast('Configure a chave da API primeiro.'); return; }
  busy = true;
  addMsg(text, 'user');
  history.push({ role:'user', text });
  setState('thinking');
  try{
    const reply = await askAI();
    history.push({ role:'assistant', text:reply });
    store.set('jarvis_hist', history.slice(-60));
    addMsg(reply, 'bot');
    speak(reply);
  }catch(e){
    history.pop();
    addMsg('Falha: ' + e.message, 'err');
    setState('idle');
  }finally{ busy = false; }
}

/* ================== VOZ: FALAR ================== */
let voices = [];
function loadVoices(){
  voices = ('speechSynthesis' in window) ? speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('pt')) : [];
  const sel = $('sVoice');
  sel.innerHTML = '<option value="">Automática</option>' + voices.map(v => `<option value="${escapeHtml(v.name)}">${escapeHtml(v.name)} (${v.lang})</option>`).join('');
  sel.value = cfg.voiceName;
}
if ('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  return voices.find(v => v.name === cfg.voiceName)
      || voices.find(v => v.lang === 'pt-BR' && /male|mascul|daniel|antonio|ricardo/i.test(v.name))
      || voices.find(v => v.lang === 'pt-BR') || voices[0] || null;
}
function forSpeech(t){ return t.replace(/https?:\/\/\S+/g, 'link').replace(/[*#_`>~|]/g, '').replace(/\s+/g, ' ').trim(); }

function speak(text){
  if (!cfg.voz || !('speechSynthesis' in window)) return afterSpeak();
  speechSynthesis.cancel();
  // Divide em frases: evita o corte de falas longas no Chrome
  const parts = forSpeech(text).match(/[^.!?;:]+[.!?;:]*/g) || [text];
  const voice = pickVoice();
  setState('speaking');
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.lang = 'pt-BR'; if (voice) u.voice = voice;
    u.rate = 1.05; u.pitch = 0.9;
    if (i === parts.length - 1){ u.onend = afterSpeak; u.onerror = afterSpeak; }
    speechSynthesis.speak(u);
  });
}
function afterSpeak(){
  if (orb.className === 'listening') return;
  setState('idle');
  if (cfg.continuo) setTimeout(startListening, 350);
}

/* ================== VOZ: OUVIR ================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function startListening(){
  if (!SR){ toast('Reconhecimento de voz indisponível neste navegador. Use o Chrome, ou digite.'); return; }
  if (busy) return;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  rec = new SR();
  rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
  let finalText = '';
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    input.value = finalText + interim;
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Permita o acesso ao microfone nas configurações do navegador.');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Erro no microfone: ' + e.error);
  };
  rec.onend = () => {
    rec = null;
    setState('idle');
    const t = (finalText || input.value).trim();
    input.value = '';
    if (t) send(t);
  };
  try{ rec.start(); setState('listening'); }catch(e){ toast('Não consegui ligar o microfone.'); }
}
function stopAll(){
  if (rec){ rec.stop(); return; }
  if ('speechSynthesis' in window && speechSynthesis.speaking){ speechSynthesis.cancel(); setState('idle'); return; }
}

orb.addEventListener('click', () => {
  if (orb.className === 'listening' || orb.className === 'speaking') stopAll();
  else startListening();
});
$('composer').addEventListener('submit', e => { e.preventDefault(); const t = input.value; input.value = ''; send(t); });

/* ================== CONFIGURAÇÕES ================== */
const dlg = $('settings');
function fillModelSelect(list){
  const sel = $('sModel');
  const def = DEFAULT_MODELS[$('sProv').value];
  const all = [...new Set([def, ...(list || []), cfg.provider === $('sProv').value ? cfg.model : ''].filter(Boolean))];
  sel.innerHTML = all.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}${m === def ? ' (padrão)' : ''}</option>`).join('');
  sel.value = (cfg.provider === $('sProv').value && cfg.model) ? cfg.model : def;
}
function openSettings(){
  $('sNome').value = cfg.nome; $('sTrat').value = cfg.tratamento;
  $('sProv').value = cfg.provider; $('sKey').value = cfg.key;
  $('sVoz').checked = cfg.voz; $('sCont').checked = cfg.continuo;
  $('sPrompt').value = cfg.prompt;
  $('keyHint').innerHTML = KEY_HINTS[cfg.provider];
  fillModelSelect(); loadVoices();
  dlg.showModal();
}
function saveSettings(){
  const prov = $('sProv').value;
  Object.assign(cfg, {
    nome: $('sNome').value.trim() || 'Jarvis',
    tratamento: $('sTrat').value.trim() || 'senhor',
    provider: prov, key: $('sKey').value.trim(),
    model: $('sModel').value === DEFAULT_MODELS[prov] ? '' : $('sModel').value,
    voiceName: $('sVoice').value, voz: $('sVoz').checked, continuo: $('sCont').checked,
    prompt: $('sPrompt').value.trim() || DEFAULT_PROMPT
  });
  store.set('jarvis_cfg', cfg);
  applyTitle();
}
$('btnSettings').onclick = openSettings;
$('btnClose').onclick = () => dlg.close();
$('btnSave').onclick = () => { saveSettings(); dlg.close(); toast('Configurações salvas.'); if (!history.length) renderHistory(); };
$('btnResetPrompt').onclick = () => { $('sPrompt').value = DEFAULT_PROMPT; };
$('btnClear').onclick = () => { if (confirm('Apagar toda a conversa?')){ history = []; store.set('jarvis_hist', []); renderHistory(); dlg.close(); } };
$('sProv').onchange = () => { $('keyHint').innerHTML = KEY_HINTS[$('sProv').value]; fillModelSelect(); };
$('btnModels').onclick = async () => {
  saveSettings();
  const b = $('btnModels'); b.textContent = 'Buscando…';
  try{ const list = await listModels(); fillModelSelect(list); toast(list.length + ' modelos encontrados.'); }
  catch(e){ toast('Erro: ' + e.message); }
  finally{ b.textContent = 'Buscar modelos disponíveis'; }
};

/* ================== INÍCIO ================== */
applyTitle();
renderHistory();
loadVoices();
if (!cfg.key) setTimeout(() => { addMsg('Primeiro acesso: abra as configurações (⚙) e cole a sua chave gratuita da API.', 'sys'); openSettings(); }, 400);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
